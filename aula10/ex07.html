<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando números</title>
</head>
<body>
    <h1>Somando números</h1>
    <label for="num1">Número 1:</label>
    <input type="number" id="num1"><br><br>
    <label for="num2">Número 2:</label>
    <input type="number" id="num2"><br><br>
    <input type="button" id="somar" onclick="somar()" value="Somar"><br><br>
    <div id="resultado">Resultado:</div>
    <script>
        function somar() {
            // Seleciona os elementos de entrada e o elemento de resultado
            const num1 = document.getElementById('num1').value;
            const num2 = document.getElementById('num2').value;
            const resultado = document.getElementById('resultado');
            
            // Converte os valores de entrada para números e calcula a soma
            const soma = Number(num1) + Number(num2);
            
            // Atualiza o conteúdo do elemento de resultado com a soma
            resultado.textContent = 'A soma entre os dois números é: ' + soma;
        }
    </script>
</body>
</html>
